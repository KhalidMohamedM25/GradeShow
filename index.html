<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Algorithm Analysis and Design student grade lookup portal">
  <title>Student Grade Lookup | Algorithm Analysis and Design</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">E</div>
      <div>
        <p class="eyebrow">Egyptian E-Learning University</p>
        <h1>Algorithm Analysis and Design</h1>
        <p class="subtitle">Student Grade Lookup Portal</p>
      </div>
    </header>

      <form id="lookup-form" novalidate>
        <label for="student-id">Student ID</label>
        <div class="input-row">
          <input id="student-id" name="studentId" type="text" inputmode="text"
                 autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="e.g. 240001" required maxlength="64">
          <button id="show-button" type="submit">Show Grades</button>
        </div>
        <p class="hint">Enter your ID exactly as provided by the university.</p>
      </form>

      <div id="status" class="status" role="status" aria-live="polite" hidden></div>
      <section id="results" class="results" aria-live="polite" hidden></section>
    </section>

    <footer>
      <p>For grade-related questions, contact the course teaching assistant.</p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
